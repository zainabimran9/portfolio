<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">🛍️ Product Cards</h1>
  <div class="flex justify-center my-6">
  <input
    type="text"
    id="searchInput"
    placeholder="Search for products..."
    class="w-80 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
</div>
   <div class="flex justify-center gap-4 mt-6">
    
    <button id="electronics" class="bg-gray-300 px-4 py-2 hover:bg-blue-400 rounded-lg">Electronics</button>
    <button id="Bags" class="bg-gray-300 px-4 py-2 hover:bg-blue-400 rounded-lg">Bags</button>
    <button id="Clothing" class="bg-gray-300 px-4 py-2 hover:bg-blue-400  rounded-lg">Clothing</button>
   
  </div>

  <!-- Card Container -->
  <div id="card-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-6 max-w-6xl mx-auto">
    <!-- JavaScript will insert cards here -->
  </div>

  <script src="script.js"></script>
</body>
</html>
